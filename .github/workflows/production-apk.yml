name: Production Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build Production Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > corealert-release.jks

      - name: Get Next Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$LATEST" ]; then
            VERSION="1.0"
          else
            CURRENT="${LATEST#v}"

            MAJOR="${CURRENT%%.*}"
            MINOR="${CURRENT#*.}"

            MINOR=$((MINOR + 1))

            VERSION="${MAJOR}.${MINOR}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Next version: v$VERSION"

      - name: Build Production Release
        run: ./gradlew assembleProductionRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/corealert-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/production/release/*.apk \
            "app/build/outputs/apk/production/release/CoreAlert-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CoreAlert ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/production/release/CoreAlert-v${{ steps.version.outputs.version }}.apk