name: Production APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > corealert-release.jks

      - name: Build Production Release
        run: ./gradlew assembleProductionRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/corealert-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: core-alert-production-apk
          path: app/build/outputs/apk/production/release/*.apk
          if-no-files-found: error